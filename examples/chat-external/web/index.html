<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat · mcp-ui-kit example</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f5f4; --surface: #fff; --ink: #15201b; --muted: #5d6b64; --line: #d6ddd9; --accent: #0b7a64;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0e1412; --surface: #151d1a; --ink: #e4ebe7; --muted: #9aa7a0; --line: #29342f; --accent: #3bc09f; }
      }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      .app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: 100vh; }
      main { display: flex; flex-direction: column; min-width: 0; }
      .log { flex: 1; overflow: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
      .msg { max-width: 860px; width: 100%; margin: 0 auto; }
      .msg.user .bubble { margin-left: auto; background: var(--accent); color: #fff; padding: 8px 12px; border-radius: 14px; width: fit-content; max-width: 80%; }
      .msg.bot .text { white-space: pre-wrap; line-height: 1.5; }
      .tool { font: 12px ui-monospace, monospace; color: var(--muted); margin-bottom: 6px; }
      form.composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface); }
      input, textarea, select, button { font: inherit; color: inherit; }
      .composer input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
      button { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      aside { border-left: 1px solid var(--line); background: var(--surface); padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
      aside h2 { font-size: 14px; margin: 0; }
      aside select, aside textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
      aside textarea { min-height: 120px; font: 12px ui-monospace, monospace; }
      .hint { font-size: 12px; color: var(--muted); margin: 0; }
      .fallback { font: 12px ui-monospace, monospace; white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-height: 240px; overflow: auto; }
      @media (max-width: 760px) { .app { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
